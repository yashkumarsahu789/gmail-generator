<!DOCTYPE html>
<html>
<head>
    <title>100% Working Infinite Temp Mail</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f2f5; }
        .box { background: #fff; padding: 20px; border-radius: 8px; width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { padding: 10px 14px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 4px 2px; }
        button:hover { background: #0056b3; }
        #emailBox, #searchBox { background: #e9ecef; padding: 10px; border-radius: 4px; margin: 10px 0; word-break: break-all; }
        input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; margin: 8px 0; box-sizing: border-box; }
        .mail { background: #f8f9fa; border-left: 4px solid #007bff; padding: 10px; margin: 6px 0; cursor: pointer; border-radius: 3px; }
        .mail:hover { background: #dee2e6; }
        pre { background: #212529; color: #39ff14; padding: 12px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>

<div class="box">
    <h2>Infinite Temp Mail (Zero Block)</h2>

    <button onclick="generateEmail()">Generate New Email</button>
    <button onclick="loadSavedEmail()">Load Saved Email</button>

    <div id="emailBox">No active email</div>

    <h3>Load Inbox by Email:</h3>
    <input id="searchEmail" placeholder="Enter username (e.g. testuser)">
    <button onclick="setCustomEmail()">Load Inbox</button>

    <h3>Inbox:</h3>
    <div id="inbox"><i>No messages found.</i></div>

    <h3>Email Content:</h3>
    <pre id="mailContent">Click an email to read content...</pre>
</div>

<script>
let sid_token = "";
let currentEmail = "";
let pollTimer = null;

// CORS proxy to allow direct double-click HTML opening
const PROXY = "https://api.allorigins.win/raw?url=";
const API_BASE = "https://api.guerrillamail.com/ajax.php";

function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    checkInbox();
    pollTimer = setInterval(checkInbox, 6000);
}

// 1. Generate Instant Infinite Email
async function generateEmail() {
    const emailBox = document.getElementById("emailBox");
    emailBox.innerHTML = "Creating infinite mailbox...";

    try {
        const res = await fetch(`${PROXY}${encodeURIComponent(API_BASE + "?f=get_email_address")}`);
        const data = await res.json();

        sid_token = data.sid_token;
        currentEmail = data.email_addr;

        emailBox.innerHTML = "<b>Your Email:</b> " + currentEmail;
        localStorage.setItem("saved_sid", sid_token);
        localStorage.setItem("saved_email", currentEmail);

        startPolling();
    } catch (err) {
        emailBox.innerHTML = "<b style='color:red;'>Connection Error. Please check internet.</b>";
    }
}

// 2. Load Saved Email
function loadSavedEmail() {
    const savedEmail = localStorage.getItem("saved_email");
    const savedSid = localStorage.getItem("saved_sid");

    if (!savedEmail || !savedSid) {
        alert("No saved email found!");
        return;
    }

    currentEmail = savedEmail;
    sid_token = savedSid;
    document.getElementById("emailBox").innerHTML = "<b>Saved Email:</b> " + currentEmail;
    startPolling();
}

// 3. Set Custom / Permanent Email Name
async function setCustomEmail() {
    const username = document.getElementById("searchEmail").value.trim().split("@")[0];
    if (!username) {
        alert("Please enter a username!");
        return;
    }

    const emailBox = document.getElementById("emailBox");
    emailBox.innerHTML = "Loading custom inbox...";

    try {
        if (!sid_token) {
            const initRes = await fetch(`${PROXY}${encodeURIComponent(API_BASE + "?f=get_email_address")}`);
            const initData = await initRes.json();
            sid_token = initData.sid_token;
        }

        const res = await fetch(`${PROXY}${encodeURIComponent(API_BASE + `?f=set_email_user&email_user=${username}&sid_token=${sid_token}`)}`);
        const data = await res.json();

        currentEmail = data.email_addr;
        emailBox.innerHTML = "<b>Active Email:</b> " + currentEmail;
        localStorage.setItem("saved_sid", sid_token);
        localStorage.setItem("saved_email", currentEmail);

        startPolling();
    } catch (err) {
        alert("Failed to load custom address");
    }
}

// 4. Auto Fetch Messages
async function checkInbox() {
    if (!sid_token) return;

    try {
        const res = await fetch(`${PROXY}${encodeURIComponent(API_BASE + `?f=check_email&seq=0&sid_token=${sid_token}`)}`);
        const data = await res.json();
        const inboxDiv = document.getElementById("inbox");

        const list = data.list || [];
        if (list.length === 0) {
            inboxDiv.innerHTML = "<i>Inbox is empty (Checking every 6 seconds)...</i>";
            return;
        }

        inboxDiv.innerHTML = "";
        list.forEach(mail => {
            const div = document.createElement("div");
            div.className = "mail";
            div.innerHTML = `<b>${mail.mail_subject || "(No Subject)"}</b><br><small>From: ${mail.mail_from}</small>`;
            div.onclick = () => readMail(mail.mail_id);
            inboxDiv.appendChild(div);
        });
    } catch (e) {
        console.error("Checking inbox failed:", e);
    }
}

// 5. Read Email Body
async function readMail(mailId) {
    const content = document.getElementById("mailContent");
    content.textContent = "Loading message...";

    try {
        const res = await fetch(`${PROXY}${encodeURIComponent(API_BASE + `?f=fetch_email&email_id=${mailId}&sid_token=${sid_token}`)}`);
        const data = await res.json();
        content.textContent = data.mail_body || "No text content found.";
    } catch (err) {
        content.textContent = "Error reading mail content.";
    }
}
</script>

</body>
</html>
