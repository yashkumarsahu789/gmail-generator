<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Infinite Temp Mail</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f2f5; margin: 0; }
        .box { background: #fff; padding: 20px; border-radius: 8px; width: 500px; margin: 20px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        button { padding: 10px 14px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 4px 2px; }
        button:hover { background: #0056b3; }
        #statusBox { background: #e9ecef; padding: 10px; border-radius: 4px; margin: 10px 0; font-size: 14px; word-break: break-all; }
        input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; margin: 8px 0; box-sizing: border-box; }
        .mail { background: #f8f9fa; border-left: 4px solid #007bff; padding: 10px; margin: 6px 0; cursor: pointer; border-radius: 3px; }
        .mail:hover { background: #dee2e6; }
        pre { background: #212529; color: #39ff14; padding: 12px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; min-height: 50px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Infinite Temp Mailbox</h2>

    <button onclick="generateNewEmail()">Generate New Email</button>
    <button onclick="loadSavedEmail()">Load Saved Email</button>

    <div id="statusBox">Click "Generate New Email" to start</div>

    <h3>Load Custom / Saved Email:</h3>
    <input id="searchEmail" placeholder="e.g. user@domain.com">
    <button onclick="loadByEmail()">Load Inbox</button>

    <h3>Inbox:</h3>
    <div id="inbox"><i>No messages found.</i></div>

    <h3>Email Content:</h3>
    <pre id="mailContent">Select an email to view its text...</pre>
</div>

<script>
let currentEmail = "";
let authToken = "";
let pollTimer = null;
const DEFAULT_PASS = "AutoPass@9876";

function updateStatus(msg, isError = false) {
    const box = document.getElementById("statusBox");
    box.style.color = isError ? "red" : "black";
    box.innerHTML = msg;
}

function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    fetchInbox();
    pollTimer = setInterval(fetchInbox, 5000);
}

// 1. Generate Truly Unique Email
async function generateNewEmail() {
    updateStatus("Fetching available domain...");
    
    try {
        // Step 1: Get available domain
        const domainRes = await fetch("https://api.mail.tm/domains");
        const domainData = await domainRes.json();
        
        if (!domainData["hydra:member"] || domainData["hydra:member"].length === 0) {
            updateStatus("No active domains found on Mail.tm", true);
            return;
        }

        const domain = domainData["hydra:member"][0].domain;
        
        // Step 2: Unique username generation (Timestamp + Random)
        const uniqueUser = "usr_" + Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
        currentEmail = `${uniqueUser}@${domain}`;

        updateStatus("Creating mailbox: " + currentEmail);

        // Step 3: Create Account
        const createRes = await fetch("https://api.mail.tm/accounts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ address: currentEmail, password: DEFAULT_PASS })
        });

        if (!createRes.ok) {
            const err = await createRes.json();
            throw new Error(err.message || "Failed to create account");
        }

        // Step 4: Login and get Token
        const tokenRes = await fetch("https://api.mail.tm/token", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ address: currentEmail, password: DEFAULT_PASS })
        });

        const tokenData = await tokenRes.json();
        authToken = tokenData.token;

        localStorage.setItem("saved_temp_email", currentEmail);
        localStorage.setItem("saved_temp_token", authToken);

        updateStatus(`<b>Active Email:</b> ${currentEmail}`);
        startPolling();
    } catch (err) {
        updateStatus("Error: " + err.message, true);
    }
}

// 2. Fetch Inbox Messages
async function fetchInbox() {
    if (!authToken) return;

    try {
        const res = await fetch("https://api.mail.tm/messages", {
            headers: { "Authorization": `Bearer ${authToken}` }
        });

        if (!res.ok) return;

        const data = await res.json();
        const inboxDiv = document.getElementById("inbox");
        const messages = data["hydra:member"] || [];

        if (messages.length === 0) {
            inboxDiv.innerHTML = "<i>Inbox is empty (auto-refreshing every 5s)...</i>";
            return;
        }

        inboxDiv.innerHTML = "";
        messages.forEach(msg => {
            const div = document.createElement("div");
            div.className = "mail";
            div.innerHTML = `<b>${msg.subject || "(No Subject)"}</b><br><small>From: ${msg.from.address}</small>`;
            div.onclick = () => readMail(msg.id);
            inboxDiv.appendChild(div);
        });
    } catch (e) {
        console.error("Polling error:", e);
    }
}

// 3. Read Single Message
async function readMail(msgId) {
    const pre = document.getElementById("mailContent");
    pre.textContent = "Loading email content...";

    try {
        const res = await fetch(`https://api.mail.tm/messages/${msgId}`, {
            headers: { "Authorization": `Bearer ${authToken}` }
        });
        const msgData = await res.json();
        pre.textContent = msgData.text || msgData.intro || "No content found in this message.";
    } catch (e) {
        pre.textContent = "Failed to load email text.";
    }
}

// 4. Load Saved Email
function loadSavedEmail() {
    const email = localStorage.getItem("saved_temp_email");
    const token = localStorage.getItem("saved_temp_token");

    if (!email || !token) {
        alert("No saved email found in this browser!");
        return;
    }

    currentEmail = email;
    authToken = token;
    updateStatus(`<b>Loaded Saved Email:</b> ${currentEmail}`);
    startPolling();
}

// 5. Load Inbox by Entering Custom Email
async function loadByEmail() {
    const email = document.getElementById("searchEmail").value.trim();
    if (!email || !email.includes("@")) {
        alert("Please enter a valid email address!");
        return;
    }

    updateStatus("Authenticating...");

    try {
        const res = await fetch("https://api.mail.tm/token", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ address: email, password: DEFAULT_PASS })
        });

        const data = await res.json();
        if (!data.token) {
            updateStatus("Could not access this inbox (Invalid email or password)", true);
            return;
        }

        authToken = data.token;
        currentEmail = email;

        localStorage.setItem("saved_temp_email", currentEmail);
        localStorage.setItem("saved_temp_token", authToken);

        updateStatus(`<b>Active Email:</b> ${currentEmail}`);
        startPolling();
    } catch (e) {
        updateStatus("Connection failed to Mail.tm API", true);
    }
}
</script>

</body>
</html>
